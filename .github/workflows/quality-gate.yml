name: quality-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install and verify pinned PowerShell
        shell: pwsh
        run: |
          $runtimePolicy = Get-Content -LiteralPath config/runtime-support.json -Raw | ConvertFrom-Json
          $ciPowerShell = $runtimePolicy.ci.powerShell
          Write-Output ("Runner bootstrap PowerShell={0}" -f $PSVersionTable.PSVersion)
          $minimumVersion = [version]$runtimePolicy.powerShell.minimumVersion
          $requiredVersion = [version]$ciPowerShell.version
          $expectedAsset = "PowerShell-$($ciPowerShell.version)-win-x64.zip"
          $expectedUrl = "https://github.com/PowerShell/PowerShell/releases/download/v$($ciPowerShell.version)/$expectedAsset"
          if (
            $requiredVersion -lt $minimumVersion -or
            $requiredVersion.Major -ne [int]$runtimePolicy.powerShell.major -or
            $requiredVersion.Minor -ne [int]$runtimePolicy.powerShell.minor -or
            $ciPowerShell.asset -ne $expectedAsset -or
            $ciPowerShell.downloadUrl -ne $expectedUrl -or
            $ciPowerShell.sha256 -notmatch '^[0-9A-Fa-f]{64}$'
          ) {
            throw 'Pinned CI PowerShell policy is invalid or below the project minimum'
          }

          $archivePath = Join-Path $env:RUNNER_TEMP $ciPowerShell.asset
          $installPath = Join-Path $env:RUNNER_TEMP "pwsh-$($ciPowerShell.version)-x64"
          $downloaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $ciPowerShell.downloadUrl -OutFile $archivePath -TimeoutSec 180
              $downloaded = $true
              break
            } catch {
              Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
              if ($attempt -eq 3) {
                throw "Official PowerShell download failed after three attempts: $($_.Exception.Message)"
              }
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not $downloaded) {
            throw 'Official PowerShell download did not complete'
          }

          $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash
          if ($actualHash -ne $ciPowerShell.sha256) {
            throw 'Official PowerShell archive SHA-256 did not match the repository pin'
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $installPath -Force
          $pwshExecutable = Join-Path $installPath 'pwsh.exe'
          if (-not (Test-Path -LiteralPath $pwshExecutable -PathType Leaf)) {
            throw 'Pinned PowerShell executable was not found in the verified archive'
          }

          $installedVersionText = (& $pwshExecutable -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' | Out-String).Trim()
          $versionCheckExitCode = $LASTEXITCODE
          if ($versionCheckExitCode -ne 0 -or [version]$installedVersionText -ne $requiredVersion) {
            throw "Pinned PowerShell version verification failed; expected $requiredVersion, found $installedVersionText"
          }
          Write-Output ("Pinned CI PowerShell={0}; archive SHA-256 verified" -f $installedVersionText)
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $installPath -Encoding utf8
          & $pwshExecutable -NoLogo -NoProfile -File ./scripts/verify-runtime.ps1 -Mode ci
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify exact pull request merge-result
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_TEST_SHA: ${{ github.sha }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            ./scripts/verify-pr-merge-result.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE" -BaseSha $env:PR_BASE_SHA -HeadSha $env:PR_HEAD_SHA -TestSha $env:EVENT_TEST_SHA
          } else {
            Write-Output 'NOT APPLICABLE: current event is not pull_request'
          }
      - name: Check project viewer JavaScript syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $html = Get-Content -LiteralPath scripts/project-viewer.html -Raw -Encoding utf8
          $scripts = [regex]::Matches($html, '(?is)<script\b[^>]*>(.*?)</script\s*>')
          if ($scripts.Count -ne 1 -or [string]::IsNullOrWhiteSpace($scripts[0].Groups[1].Value)) {
            throw 'Expected exactly one non-empty inline script in project-viewer.html'
          }
          $node = (Get-Command node -CommandType Application -TotalCount 1 -ErrorAction Stop).Source
          $scripts[0].Groups[1].Value | & $node --check -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'PASS: project viewer JavaScript syntax'

      - name: Run quality gate and record tested revisions
        shell: pwsh
        env:
          PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_TEST_SHA: ${{ github.sha }}
        run: |
          $runtimePolicy = Get-Content -LiteralPath config/runtime-support.json -Raw | ConvertFrom-Json
          $pwshExecutable = Join-Path $env:RUNNER_TEMP "pwsh-$($runtimePolicy.ci.powerShell.version)-x64/pwsh.exe"
          if (-not (Test-Path -LiteralPath $pwshExecutable -PathType Leaf)) {
            throw 'Pinned PowerShell executable is missing from RUNNER_TEMP'
          }
          $env:PATH = (Split-Path -Parent $pwshExecutable) + ';' + $env:PATH
          $runtimeVersion = (& $pwshExecutable -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or [version]$runtimeVersion -lt [version]$runtimePolicy.powerShell.minimumVersion) {
            throw "Quality gate runtime is below policy minimum: $runtimeVersion"
          }
          Write-Output ("Quality gate PowerShell={0}" -f $runtimeVersion)
          if ($env:PR_HEAD_SHA) {
            $summary = @"
          ## Pull request verification
          - PR head SHA: $env:PR_HEAD_SHA
          - PR base SHA: $env:PR_BASE_SHA
          - Tested merge-result SHA: $env:EVENT_TEST_SHA
          "@
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary
          }
          & $pwshExecutable -NoLogo -NoProfile -File ./scripts/quality-gate.ps1
          exit $LASTEXITCODE
