<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проекты и задачи</title>
<style>
:root {color-scheme:light dark; font:15px system-ui; --accent:#175eaa; --line:#89929b; --surface:#f2f6fa}
@media(prefers-color-scheme:dark){:root{--accent:#9acaff;--surface:#202b38}}
body{margin:0;padding:clamp(1rem,4vw,3rem);max-width:100rem}
header, .tools {display:flex;flex-wrap:wrap;gap:1rem;align-items:center}
header{justify-content:space-between} h1,h2{margin:.5rem 0}
button,input,select{font:inherit;padding:.45rem .65rem} button{cursor:pointer}
a,.task{color:var(--accent)} .task{background:none;border:0;text-align:start;padding:0;text-decoration:underline}
label{display:inline-flex;align-items:center;gap:.4rem}.tools{margin:1rem 0}
.table{overflow:auto;border:1px solid var(--line);border-radius:.6rem}
table{width:100%;border-collapse:collapse;text-align:start} th,td{text-align:start;vertical-align:top;padding:.65rem;border-bottom:1px solid var(--line)}
thead{background:var(--surface)} pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:1rem;background:var(--surface)}
dialog{width:min(78rem,85vw);max-height:85vh;overflow:auto;border:1px solid var(--line);border-radius:.6rem}
li,.task-evidence{overflow-wrap:anywhere} .badge{font-weight:600}
.board[hidden] { display: none; }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: .75rem; }
.board section { border: 1px solid; border-radius: .5rem; padding: .75rem; min-width: 0; overflow-wrap: anywhere; }
.board ul { padding-inline-start: 1.25rem; }
.board li + li { margin-top: .75rem; }
#overview { display: flex; gap: .5rem; flex-wrap: wrap; margin-block: .75rem; }
#overview button[aria-pressed="true"] { color: var(--accent); background: var(--surface); border-color: currentColor; text-decoration: underline; text-underline-offset: .18em; }
#overview button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dashboard, section[aria-labelledby="period-title"] { margin-block: 1rem; padding: clamp(.75rem, 2vw, 1.25rem); border: 1px solid var(--line); border-radius: .75rem; }
.dashboard h3, #period-title { margin-block-start: 0; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9rem), 1fr)); gap: .65rem; padding: 0; }
.metrics > div { padding: .75rem; border-radius: .5rem; background: var(--surface); }
.metrics dd { margin: .2rem 0 0; font-size: 1.45rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.daily-chart { list-style: none; padding: 0; }
.daily-chart li { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr)); gap: .6rem; padding: .55rem 0; border-block-end: 1px solid var(--line); }
.daily-chart meter, #progress-scale meter { display: block; width: 100%; }
</style>
<header><h1>Проекты и задачи</h1><button id="refresh">Обновить</button></header>
<p id="notice" role="status"></p>
<section id="portfolio" aria-labelledby="portfolio-title">
<h2 id="portfolio-title">Проекты</h2><ul id="projects"></ul>
<section aria-labelledby="owner-queue-title">
<h3 id="owner-queue-title">Ожидают решения владельца</h3>
<ul id="owner-queue"></ul>
</section>
</section>
<section id="project" hidden aria-labelledby="name">
<button id="back">Все проекты</button><h2 id="name" tabindex="-1"></h2><ul id="sources"></ul>
<section class="dashboard" aria-labelledby="progress-title">
<h3 id="progress-title">Ход разработки</h3>
<dl id="progress-totals" class="metrics"></dl>
<p id="progress-freshness" hidden></p>
<div id="progress-scale"></div>
<div id="overview" aria-label="Фильтры сводки проекта"></div>
</section>
<section aria-labelledby="period-title">
<h3 id="period-title">Работа за период</h3>
<form id="period-form" class="tools">
<label>Период <select id="period-range">
<option value="1">Сегодня</option><option value="3">3 дня</option>
<option value="7">7 дней</option><option value="30">30 дней</option>
<option value="custom">Свои даты</option></select></label>
<span id="period-custom" hidden><label>С <input id="period-from" type="date"></label>
<label>По <input id="period-through" type="date"></label></span>
<button type="submit">Показать отчёт</button>
<button type="button" id="period-download" disabled>Скачать JSON</button>
</form>
<p id="period-status" role="status"></p>
<div id="period-result"></div>
</section>
<section aria-labelledby="timeline-title">
<h3 id="timeline-title">Этапы проекта</h3>
<p id="project-dates"></p>
<ul id="timeline"></ul>
</section>
<div class="tools">
<label>Этап <select id="stage"><option value="">Все этапы</option></select></label>
<label>Поиск <input id="query" type="search" placeholder="Номер или название"></label>
<label>Состояние <select id="state"></select></label>
<label><input id="blocked" type="checkbox"> Заблокировано</label>
<label><input id="decision" type="checkbox"> Требует моего решения</label>
</div>

<label>Вид <select id="view"><option value="list">Список</option><option value="board">Доска</option></select></label>
<p id="count" aria-live="polite"></p>
<div class="table" id="list-view"><table><thead><tr><th>Задача</th><th>Состояние</th><th>Исполнитель</th><th>Блокер</th><th>Следующее действие</th></tr></thead><tbody id="rows"></tbody></table></div><div class="board" id="board" hidden></div>
</section>
<section id="queue" hidden aria-labelledby="queue-title">
<h2 id="queue-title">Задания без связи</h2><p id="queue-state" role="status"></p><div id="unlinked"></div>
</section>
<dialog id="card" aria-labelledby="card-title">
<header><h2 id="card-title"></h2><div><button id="refresh-card">Обновить</button> <button id="close">Закрыть</button></div></header>
<div id="versions"></div>
</dialog>
<script>
'use strict';
const byId = id => document.getElementById(id);
const node = (tag, text) => {
  const result = document.createElement(tag);
  if (text !== undefined) result.textContent = text;
  return result;
};
function renderAssignments(assignments, stale) {
  const list = node('ul');
  for (const item of assignments) {
    const label = {
      assigned: 'Задание выдано', reported: 'Отчёт сдан, ожидает проверки',
      accepted: 'Отчёт принят', unknown: item.accepted?.state === 'unavailable'
        ? 'Приёмка не подтверждена' : 'Статус задания неизвестен'
    }[item.state];
    const comparison = {
      match: 'копии совпадают', conflict: 'конфликт копий',
      missing: 'сданная копия отсутствует', unavailable: 'сверка недоступна'
    }[item.comparison];
    const entry = node('li', [item.id, item.assignee, label,
      item.state === 'accepted' ? comparison : '', stale ? 'последнее наблюдение' : ''].filter(Boolean).join(' · '));
    if (item.lastKnown) entry.append(node('p', 'Последний статус: ' + item.lastKnown.state +
      ' · ' + new Date(item.lastKnown.updated).toLocaleString('ru')));
    for (const [kind, title] of [['report','Сданная копия'], ['accepted','Принятая копия']]) {
      const copy = item[kind];
      if (copy?.state === 'unavailable') entry.append(node('p', title + ' недоступна'));
      if (copy?.state !== 'readable') continue;
      const details = node('details');
      details.append(node('summary', title), node('p', 'SHA-256 ' + copy.hash));
      const content = node('pre');
      details.append(content);
      details.addEventListener('toggle', async () => {
        if (!details.open) return;
        try {
          const report = await request('report?' + new URLSearchParams({assignment:item.id, copy:kind}));
          content.textContent = report.hash === copy.hash ? report.text : 'Отчёт изменился. Обновите панель.';
        } catch {
          content.textContent = 'Не удалось прочитать отчёт.';
        }
      });
      entry.append(details);
    }
    list.append(entry);
  }
  return list;
}
const controls = ['query', 'state', 'blocked', 'decision'];
const missing = 'Не указано';
let projects = [];
let selected;
let viewGeneration = 0;

async function request(path, method = 'GET') {
  const response = await fetch(path, {method, cache:'no-store'});
  if (!response.ok) throw new Error('REQUEST_FAILED');
  return response.json();
}

function showProject(id) {
  selected = id;
  clearPeriod();
  boardFilter = '';
  byId('stage').value = '';
  for (const control of controls) {
    const element = byId(control);
    if (element.type === 'checkbox') element.checked = false;
    else element.value = '';
  }
  render();
  if (id) {
    byId('name').focus();
    byId('period-range').value = '1';
    byId('period-custom').hidden = true;
    byId('period-form').requestSubmit();
  }
  else byId('projects').querySelector('button')?.focus();
}

function renderOwnerQueue() {
  const list = byId('owner-queue');
  const entries = [];
  for (const project of projects) {
    for (const task of project.tasks) {
      const pending = task.versions.filter(version => version.needsDecision);
      if (!pending.length) continue;
      const entry = node('li');
      const open = taskButton(project, task);
      const actions = [...new Set(pending.map(version => version.nextAction).filter(Boolean))];
      const action = task.action?.text ?? (actions.length ? actions.join(' · ') : 'Получить решение владельца');
      const losesSource = task.unreadable.length || pending.some(version => version.sources.some(source => source.stale));
      entry.append(node('strong', project.name + ' · '), open,
        node('div', action + (task.action?.blocked ? ' · Заблокировано' : '')),
        node('div', 'Дата ожидания: нет даты' + (losesSource ? ' · Источник прочитан не полностью' : '')));
      if (pending.some(version => version.links.length) || task.assignments?.length) {
        entry.append(node('div', 'Доказательства в карточке'));
      }
      entries.push(entry);
    }
  }
  list.replaceChildren(...(entries.length ? entries : [node('li', 'Нет задач с указанным ожиданием решения')]));
}

const taskCountRules = new Intl.PluralRules('ru');
const taskCountForms = {one: 'задача', few: 'задачи', many: 'задач', other: 'задачи'};
function formatTaskCount(count) {
  return count + ' ' + taskCountForms[taskCountRules.select(count)];
}

function render() {
  const project = projects.find(item => item.id === selected);
  byId('portfolio').hidden = Boolean(project);
  byId('project').hidden = !project;
  byId('projects').replaceChildren(...projects.map(item => {
    const entry = node('li');
    const button = node('button', item.name);
    button.addEventListener('click', () => showProject(item.id));
    const unavailable = item.sources.some(source => source.error);
    entry.append(button, ' · ' + formatTaskCount(item.tasks.length) + (unavailable ? ' · Есть ошибки чтения' : ''));
    return entry;
  }));
  const queueProject = projects.find(item => item.queue);
  byId('queue').hidden = Boolean(project) || !queueProject;
  if (queueProject && !project) {
    const {queue, unlinkedAssignments} = queueProject;
    byId('queue-state').textContent = queue.stale
      ? (queue.updated ? 'Очередь недоступна · последняя сверка ' + new Date(queue.updated).toLocaleString('ru') : 'Очередь недоступна · статус неизвестен')
      : '';
    byId('unlinked').replaceChildren(unlinkedAssignments.length
      ? renderAssignments(unlinkedAssignments, queue.stale) : node('p', 'Нет заданий без связи'));
  }
  if (!project) {
    renderOwnerQueue();
    return;
  }
  byId('name').textContent = project.name;
  renderTimeline(project.timeline);
  const sources = project.sources.map(source =>
    node('li', source.path + ' · ' + sourceStatus(source.updated, source.error)));
  if (project.queue) {
    sources.push(node('li', 'Очередь ' + project.queue.id + ' · ' +
      sourceStatus(project.queue.updated, project.queue.stale ? 'Очередь недоступна' : '')));
  }
  sources.push(node('li', project.historyConfigured
    ? 'Источник истории настроен · доступность и покрытие проверяются при построении отчёта'
    : 'Источник истории не подключён'));
  byId('sources').replaceChildren(...sources);
  const state = byId('state');
  const previous = state.value;
  const statuses = [...new Set(project.tasks.flatMap(task => task.versions.map(version => version.status)).filter(Boolean))].sort();
  state.replaceChildren(new Option('Все состояния', ''), ...statuses.map(status => new Option(status, status)));
  if (statuses.includes(previous)) state.value = previous;
  renderRows();
}

function sourceStatus(updated, error) {
  if (!updated) return error ? error + ' · Снимка нет' : 'Время чтения неизвестно';
  const time = new Date(updated).toLocaleString('ru');
  return error ? error + ' · Последний полный снимок: ' + time : 'Прочитано: ' + time;
}

function renderTimeline(timeline) {
  const date = value => {
    const time = node('time', value);
    time.dateTime = value;
    return time;
  };
  const dates = byId('project-dates');
  dates.replaceChildren();
  dates.append(...(timeline?.startDate ? ['Старт: ', date(timeline.startDate)] : ['Старт не указан']));
  if (timeline) dates.append(' · Сегодня: ', date(timeline.today), ' · ', timeline.timeZone);

  const selector = byId('stage');
  const previous = selector.value;
  const stages = timeline?.stages ?? [];
  selector.replaceChildren(new Option('Все этапы', ''),
    ...stages.map(stage => new Option(stage.name, stage.id)));
  if (stages.some(stage => stage.id === previous)) selector.value = previous;
  byId('timeline').replaceChildren(...stages.map(stage => {
    const item = node('li');
    const button = node('button', stage.name);
    button.addEventListener('click', () => {
      selector.value = stage.id;
      renderRows();
      selector.focus();
    });
    item.append(button, ' · План: ', stage.plannedDate ? date(stage.plannedDate) : 'не указан',
      ' · Факт: ', stage.actualDate ? date(stage.actualDate) : 'не указан');
    return item;
  }));
  if (!stages.length) byId('timeline').append(node('li', 'Этапы не указаны'));
}

const columns = [
  ['queued', 'В очереди', ['draft', 'backlog', 'ready', 'assigned']],
  ['active', 'В работе', ['in_progress', 'running']],
  ['review', 'Ревью', ['in_review', 'review']],
  ['acceptance', 'Приёмка', ['submitted', 'reported', 'verifying']],
  ['done', 'Завершено', ['accepted', 'closed', 'completed', 'done', 'merged']],
  ['other', 'Другие состояния', ['cancelled', 'superseded', 'withdrawn']],
  ['unknown', 'Неизвестно', []]
];

function boardState(task) {
  const states = new Set(task.versions.map(version => version.status));
  if (states.size !== 1) return 'unknown';
  const status = states.values().next().value;
  return columns.find(([, , statuses]) => statuses.includes(status))?.[0] ?? 'unknown';
}

function taskButton(project, task) {
  const titles = [...new Set(task.versions.map(version => version.title).filter(Boolean))];
  const label = titles.length === 1 && titles[0].startsWith(task.id) ? titles[0] :
    [task.id, ...titles].join(' · ');
  const button = node('button', label);
  button.className = 'task';
  button.dataset.projectId = project.id;
  button.dataset.taskId = task.id;
  button.addEventListener('click', () => {
    cardOpener = button;
    openCard(project, task);
  });
  return button;
}

function renderBoard(project, tasks, states) {
  byId('board').replaceChildren(...columns.map(([id, label]) => {
    const column = node('section');
    const items = tasks.filter(task => states.get(task.id) === id);
    const list = node('ul');
    for (const task of items) {
      const entry = node('li');
      entry.append(taskButton(project, task));
      for (const [key, caption] of [['assignee', 'Исполнитель'], ['blocker', 'Блокер'], ['nextAction', 'Далее']]) {
        const values = [...new Set(task.versions.map(version => version[key]).filter(Boolean))];
        if (key === 'nextAction' && task.action) {
          entry.append(node('div', caption + ': ' + task.action.text + (task.action.blocked ? ' · Заблокировано' : '')));
        } else if (values.length) {
          entry.append(node('div', caption + ': ' + values.join(' · ')));
        }
      }
      list.append(entry);
    }
    column.append(node('h3', label + ' (' + items.length + ')'), list);
    return column;
  }));
}

let boardFilter = '';
function renderOverview(project, states) {
  const overview = byId('overview');
  const counts = new Map(columns.map(([id]) => [id, 0]));
  for (const state of states.values()) counts.set(state, counts.get(state) + 1);
  const remaining = ['queued', 'active', 'review', 'acceptance'].reduce((sum, state) => sum + counts.get(state), 0);
  const metrics = [
    ['Завершено', counts.get('done')], ['Осталось по известным статусам', remaining],
    ['В работе', counts.get('active')], ['На ревью и приёмке', counts.get('review') + counts.get('acceptance')],
    ['Статус неизвестен', counts.get('unknown')]
  ];
  byId('progress-totals').replaceChildren(...metrics.map(([label, value]) => {
    const item = node('div');
    item.append(node('dt', label), node('dd', String(value)));
    return item;
  }));
  const freshness = byId('progress-freshness');
  freshness.hidden = !project.sources.some(source => source.error);
  freshness.textContent = freshness.hidden ? '' : 'Часть источников недоступна. Остаток рассчитан по доступному снимку.';
  const scale = byId('progress-scale');
  scale.replaceChildren();
  const done = counts.get('done');
  const knownScope = done + remaining;
  if (freshness.hidden && !counts.get('unknown') && knownScope) {
    const caption = 'Завершено ' + done + ' из ' + knownScope + ' задач в рабочем объёме';
    const bar = node('meter');
    bar.max = knownScope;
    bar.value = done;
    bar.setAttribute('aria-label', caption);
    scale.append(node('span', caption), bar);
  }
  const buttons = columns.map(([id, label]) => {
    const count = counts.get(id);
    const button = node('button', label + ' (' + count + ')');
    button.setAttribute('aria-pressed', String(boardFilter === id));
    button.addEventListener('click', () => {
      boardFilter = boardFilter === id ? '' : id;
      renderRows();
      byId('overview').children[columns.findIndex(([key]) => key === id)]?.focus();
    });
    return button;
  });
  const blocked = node('button', 'Блокеры (' + project.tasks.filter(task => task.versions.some(version => version.blocker)).length + ')');
  blocked.setAttribute('aria-pressed', String(byId('blocked').checked));
  blocked.addEventListener('click', () => {
    byId('blocked').checked = !byId('blocked').checked;
    renderRows();
    byId('overview').lastElementChild.focus();
  });
  overview.replaceChildren(...buttons, blocked);
}

function renderRows() {
  const project = projects.find(item => item.id === selected);
  if (!project) return;
  const query = byId('query').value.trim().toLocaleLowerCase('ru');
  const state = byId('state').value;
  const stage = project.timeline?.stages.find(item => item.id === byId('stage').value);
  const stageTasks = stage ? new Set(stage.taskIds) : null;
  const blocked = byId('blocked').checked;
  const decision = byId('decision').checked;
  const idMatch = task => task.id.toLowerCase().includes(query);
  const matching = project.tasks.filter(task =>
    (!state && !blocked && !decision && idMatch(task)) ||
    task.versions.some(version => (idMatch(task) || version.title.toLocaleLowerCase('ru').includes(query)) &&
      (!state || version.status === state) && (!blocked || version.blocker) && (!decision || version.needsDecision)));
  const states = new Map(project.tasks.map(task => [task.id, boardState(task)]));
  const visible = matching.filter(task =>
    (!stageTasks || stageTasks.has(task.id)) && (!boardFilter || states.get(task.id) === boardFilter));
  renderOverview(project, states);
  byId('count').textContent = visible.length + ' из ' + project.tasks.length;
  const boardVisible = byId('view').value === 'board';
  byId('list-view').hidden = boardVisible;
  byId('board').hidden = !boardVisible;
  if (boardVisible) {
    renderBoard(project, visible, states);
    return;
  }
  byId('rows').replaceChildren(...visible.map(task => {
    const row = node('tr');
    const cell = node('td');
    cell.append(taskButton(project, task));
    if (task.versions.length > 1) cell.append(node('div', 'Версии расходятся'));
    if (task.unreadable.length) cell.append(node('div', 'Ошибка чтения'));
    if (task.versions.some(version => version.sources.some(source => source.stale))) cell.append(node('div', 'Есть устаревший источник'));
    row.append(cell);
    for (const key of ['status','assignee','blocker','nextAction']) {
      if (key === 'nextAction' && project.queue) {
        const action = task.action;
        row.append(node('td', action ? action.text + (action.blocked ? ' · Заблокировано' : '') : 'Следующее действие не задано'));
        continue;
      }
      const values = [...new Set(task.versions.map(version => version[key] || missing))];
      row.append(node('td', values.length ? values.join(' · ') : missing));
    }
    return row;
  }));
}

let activeCard;
let cardOpener;

function restoreTaskFocus(button) {
  if (!button) return;
  if (button.isConnected && !button.closest('[hidden]')) {
    button.focus();
    return;
  }
  const replacement = [...document.querySelectorAll('button.task')].find(item =>
    item.dataset.projectId === button.dataset.projectId &&
    item.dataset.taskId === button.dataset.taskId && !item.closest('[hidden]'));
  (replacement ?? (byId('project').hidden ? byId('refresh') : byId('query'))).focus();
}
async function openCard(project, task) {
  activeCard = {projectId: project.id, taskId: task.id};
  const generation = ++viewGeneration;
  byId('card-title').textContent = task.id;
  const container = byId('versions');
  container.replaceChildren(...task.unreadable.map(path => node('p', 'Ошибка чтения · ' + path)));
  if (task.action) {
    const action = task.action;
    container.append(node('p', action.text + (action.blocked ? ' · Заблокировано: сверка не подтверждена' : '') +
      (action.assignments?.length ? ' · ' + action.assignments.join(', ') : '')));
  }
  if (task.assignments?.length) {
    const queue = project.queue;
    container.append(node('h3', 'Задания'));
    if (queue.stale) container.append(node('p', queue.updated
      ? 'Очередь недоступна · последняя сверка ' + new Date(queue.updated).toLocaleString('ru')
      : 'Очередь недоступна · статус неизвестен'));
    container.append(renderAssignments(task.assignments, queue.stale));
  }
  if (task.evidence) {
    const {state, record} = task.evidence;
    const section = node('section');
    section.className = 'task-evidence';
    section.append(node('h3', 'Доказательства'));
    if (state === 'stale') section.append(node('p', 'Снимок устарел · источник недоступен'));
    if (!record) {
      section.append(node('p', state === 'readable' ? 'Нет сведений по задаче' : 'Источник недоступен'));
    } else {
      section.append(node('p', 'Наблюдение · ' + new Date(record.observedAt).toLocaleString('ru')));
      section.append(node('p', 'Head ' + record.headSha + ' · Base ' + record.baseSha));
      const statusLabels = {approved:'Одобрено', changes_requested:'Запрошены изменения',
        success:'Успешно', failure:'Ошибка', pending:'Ожидается', accepted:'Принято', revoked:'Отозвано'};
      for (const [field, label] of [['review', 'Ревью'], ['ci', 'CI']]) {
        const fact = record[field];
        section.append(node('p', label + ' · ' + (fact
          ? statusLabels[fact.status] + (fact.current ? '' : ' · прежняя пара ' + fact.headSha + ' / ' + fact.baseSha)
          : 'нет сведений')));
      }
      if (record.ci) section.append(node('p', 'Тестовый коммит CI · ' + record.ci.mergeResultSha));
      section.append(node('p', 'Слияние · ' + (record.mergeSha ?? 'нет сведений')));
      const decision = record.ownerAcceptance;
      section.append(node('p', 'Приёмка владельцем · ' + (decision
        ? statusLabels[decision.status] + ' · ' + new Date(decision.decidedAt).toLocaleString('ru')
        : 'нет сведений')));
    }
    container.append(section);
  }
  if (!byId('card').open) byId('card').showModal();
  for (const [index, version] of task.versions.entries()) {
    const section = node('section');
    section.append(node('h3', 'Версия ' + (index + 1)));
    const age = value => {
      if (!value) return 'Нет даты';
      const minutes = Math.max(0, Math.floor((Date.now() - Date.parse(value)) / 60000));
      if (minutes < 60) return minutes + ' мин';
      const hours = Math.floor(minutes / 60);
      return hours < 24 ? hours + ' ч' : Math.floor(hours / 24) + ' дн ' + hours % 24 + ' ч';
    };
    section.append(node('p', 'В текущем статусе: ' + age(version.statusSince)));
    if (version.blocker) section.append(node('p', 'Длительность блокировки: ' + age(version.blockedSince)));
    const list = node('ul');
    for (const source of version.sources) list.append(node('li', source.path + (source.stale ? ' · Устарело' : '')));
    section.append(list);
    if (version.links.length) {
      const links = node('ul');
      for (const link of version.links) {
        const item = node('li');
        const anchor = node('a', link.includes('/actions/runs/') ? 'CI · ' + link : 'PR · ' + link);
        anchor.href = link;
        anchor.target = '_blank';
        anchor.rel = 'noopener noreferrer';
        item.append(anchor); links.append(item);
      }
      section.append(links, node('p', {
        previous:'Проверка прежней ревизии', matches:'Указанные ревизии совпадают', unknown:'Привязка не подтверждена'
      }[version.binding]));
    }
    const text = node('pre', 'Загрузка…');
    section.append(text);
    container.append(section);
    try {
      const params = new URLSearchParams({project:project.id, task:task.id, version:version.hash});
      const card = await request('card?' + params);
      if (generation !== viewGeneration) return;
      text.textContent = card.text;
    } catch {
      text.textContent = 'Не удалось загрузить версию. Обновите список задач.';
    }
  }
}

const eventLabels = {
  started:'Начато', reported:'Сдано отчётов', reviewed:'Завершено ревью',
  merged:'Слито PR', added:'Добавлено задач', accepted:'Принято задач',
  acceptance_revoked:'Отозвано приёмок'
};
let periodSnapshot;
let periodGeneration = 0;

function clearPeriod() {
  periodGeneration++;
  periodSnapshot = undefined;
  byId('period-result').replaceChildren();
  byId('period-status').textContent = '';
  byId('period-download').disabled = true;
}

function renderPeriod(snapshot) {
  const {period, report, historyState, coverage} = snapshot;
  const range = period.From + ' — ' + period.Through + ' · ' + period.TimeZone;
  const status = byId('period-status');
  if (!report) {
    status.textContent = range + ' · ' +
      (historyState === 'unconfigured' ? 'Источник истории не подключён' : 'История недоступна');
    return;
  }
  status.textContent = range + (Object.values(coverage).every(metric => metric.complete)
    ? ' · История полная' : ' · История неполная');
  const instant = value => {
    const date = new Date(value);
    try {
      return date.toLocaleString('ru-RU', {timeZone: period.TimeZone, dateStyle:'short', timeStyle:'short'});
    } catch (error) {
      if (!(error instanceof RangeError)) throw error;
      return date.toISOString();
    }
  };
  status.textContent += ' · История прочитана: ' + instant(snapshot.historyReadAt);
  const result = byId('period-result');
  const totals = node('ul');
  for (const [type, label] of Object.entries(eventLabels)) {
    const metric = coverage[type];
    const item = node('li', label + ': ' + (metric.complete ? '' : 'подтверждено ') + report.totals[type]);
    if (!metric.complete) {
      const details = node('details');
      const intervals = node('ul');
      for (const gap of metric.gaps) intervals.append(node('li', (gap.eventType ? eventLabels[gap.eventType] + ': ' : '') + instant(gap.from) + ' — ' + instant(gap.until)));
      details.append(node('summary', 'Пропуски истории'), intervals);
      item.append(details);
    }
    totals.append(item);
  }
  const chart = node('ul');
  chart.className = 'daily-chart';
  const daily = Object.entries(report.days);
  const series = [['accepted', 'Принято задач'], ['merged', 'Слито PR']];
  const peak = daily.reduce((max, [, metrics]) => Math.max(max, metrics.accepted ?? 0, metrics.merged ?? 0), 1);
  for (const [day, metrics] of daily) {
    const total = Object.values(metrics).reduce((sum, count) => sum + count, 0);
    const item = node('li');
    item.append(node('strong', day + ' · Событий: ' + total));
    for (const [type, label] of series) {
      const count = metrics[type] ?? 0;
      const caption = label + ': ' + (coverage[type].complete ? '' : 'подтверждено ') + count;
      const column = node('span', caption);
      const bar = node('meter');
      bar.min = 0;
      bar.max = peak;
      bar.value = count;
      bar.setAttribute('aria-label', day + ' · ' + caption);
      column.append(bar);
      item.append(column);
    }
    chart.append(item);
  }
  const events = node('ul');
  for (const event of report.events) {
    events.append(node('li', event.day + ' · ' + event.taskId + ' · ' + eventLabels[event.type] +
      (event.counted ? '' : ' · Не входит в итог')));
  }
  result.append(node('h4', 'Итоги'), totals, node('h4', 'События по дням'),
    daily.length ? chart : node('p', 'За период нет подтверждённых событий'),
    node('h4', 'Детализация'), events);
  periodSnapshot = snapshot;
  byId('period-download').disabled = false;
}

byId('period-range').addEventListener('change', () => {
  byId('period-custom').hidden = byId('period-range').value !== 'custom';
  clearPeriod();
});
for (const id of ['period-from', 'period-through']) byId(id).addEventListener('input', clearPeriod);
byId('period-form').addEventListener('submit', async event => {
  event.preventDefault();
  clearPeriod();
  const generation = periodGeneration;
  const params = new URLSearchParams({project: selected});
  const choice = byId('period-range').value;
  if (choice === 'custom') {
    const from = byId('period-from').value;
    const through = byId('period-through').value;
    if (!from || !through || from > through) {
      byId('period-status').textContent = 'Укажи начало и конец периода';
      return;
    }
    params.set('from', from);
    params.set('through', through);
  } else params.set('days', choice);
  byId('period-status').textContent = 'Чтение истории…';
  try {
    const snapshot = await request('period?' + params);
    if (generation === periodGeneration) renderPeriod(snapshot);
  } catch {
    if (generation === periodGeneration) byId('period-status').textContent = 'Не удалось построить отчёт. Проверь даты.';
  }
});
byId('period-download').addEventListener('click', () => {
  if (!periodSnapshot) return;
  const url = URL.createObjectURL(new Blob([JSON.stringify(periodSnapshot, null, 2)], {type:'application/json'}));
  const link = node('a');
  link.href = url;
  link.download = 'project-period.json';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

function validSnapshot(snapshot) {
  return Array.isArray(snapshot) && snapshot.every(project =>
    project && typeof project.id === 'string' && Array.isArray(project.sources) && Array.isArray(project.tasks) &&
    Array.isArray(project.unlinkedAssignments) &&
    (!project.timeline || (Array.isArray(project.timeline.stages) &&
      project.timeline.stages.every(stage => stage && Array.isArray(stage.taskIds)))) &&
    project.tasks.every(task => task && typeof task.id === 'string' && Array.isArray(task.unreadable) &&
      Array.isArray(task.versions) && task.versions.every(version =>
        version && typeof version.title === 'string' && Array.isArray(version.sources) && Array.isArray(version.links))));
}
async function load(refresh) {
  const button = byId('refresh');
  if (button.disabled) return;
  button.disabled = true;
  byId('refresh-card').setAttribute('aria-disabled', 'true');
  byId('notice').textContent = 'Чтение источников…';
  try {
    const snapshot = await request(refresh ? 'refresh' : 'summary', refresh ? 'POST' : 'GET');
    if (!validSnapshot(snapshot)) throw new Error('Invalid summary');
    if (refresh) clearPeriod();
    const focusedTask = document.activeElement?.matches('button.task') ? document.activeElement : null;
    projects = snapshot;
    render();
    if (refresh && !byId('project').hidden) byId('period-form').requestSubmit();
    if (focusedTask && !byId('card').open && !focusedTask.isConnected) restoreTaskFocus(focusedTask);
    if (activeCard && byId('card').open) {
      const project = projects.find(item => item.id === activeCard.projectId);
      const task = project?.tasks.find(item => item.id === activeCard.taskId);
      if (task) await openCard(project, task);
      else {
        viewGeneration++;
        byId('versions').replaceChildren(node('p', 'Карточка отсутствует в текущем снимке.'));
      }
    }
    byId('notice').textContent = projects.some(project => project.queue?.stale || project.sources.some(source => source.error))
      ? 'Часть источников прочитать не удалось.' : '';
  } catch {
    byId('notice').textContent = 'Обновление не удалось. Показаны данные последней загрузки.';
  } finally {
    button.disabled = false;
    byId('refresh-card').removeAttribute('aria-disabled');
  }
}

byId('refresh').addEventListener('click', () => load(true));
byId('refresh-card').addEventListener('click', () => load(true));
byId('view').addEventListener('change', renderRows);
byId('stage').addEventListener('change', renderRows);
byId('back').addEventListener('click', () => showProject(undefined));
byId('close').addEventListener('click', () => byId('card').close());
byId('card').addEventListener('close', () => {
  viewGeneration++;
  activeCard = undefined;
  const opener = cardOpener;
  cardOpener = undefined;
  const focusAfterClose = document.activeElement;
  requestAnimationFrame(() => {
    const dialog = byId('card');
    const focused = document.activeElement;
    if (!dialog.open && (focused === focusAfterClose || focused === document.body ||
        focused === document.documentElement || dialog.contains(focused))) {
      restoreTaskFocus(opener);
    }
  });
});
for (const id of controls) byId(id).addEventListener('input', renderRows);
load(false);
</script>
</html>
